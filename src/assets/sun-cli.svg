<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Outer Card Canvas -->
  <rect width="800" height="1000" rx="32" fill="#0B0F17" stroke="#1E293B" stroke-width="6"/>

  <!-- Terminal Window Header -->
  <rect x="24" y="24" width="752" height="56" rx="16" fill="#1E293B"/>
  
  <!-- Mac Window Control Dots -->
  <circle cx="56" cy="52" r="8" fill="#EF4444"/>
  <circle cx="80" cy="52" r="8" fill="#F59E0B"/>
  <circle cx="104" cy="52" r="8" fill="#10B981"/>

  <!-- Terminal Title -->
  <text x="400" y="58" font-family="monospace, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="middle">Command Prompt - sun.exe</text>

  <!-- Go Gopher Badge / Logo Accent (Top Right) -->
  <g transform="translate(680, 36)">
    <rect width="72" height="32" rx="8" fill="#00ADD8" fill-opacity="0.15" stroke="#00ADD8" stroke-width="1.5"/>
    <text x="36" y="21" font-family="monospace, sans-serif" font-size="13" font-weight="800" fill="#00ADD8" text-anchor="middle">GO CLI</text>
  </g>

  <!-- Terminal Body Area -->
  <rect x="24" y="80" width="752" height="896" rx="16" fill="#05070A"/>

  <g transform="translate(48, 120)" font-family="Consolas, Monaco, 'Courier New', monospace">
    
    <!-- Build Command -->
    <text x="0" y="0" font-size="20" fill="#00ADD8" font-weight="700">C:\Dev\sun&gt;</text>
    <text x="160" y="0" font-size="20" fill="#F8FAFC">go build -o sun.exe</text>

    <!-- Command 1: Enugu -->
    <text x="0" y="44" font-size="20" fill="#00ADD8" font-weight="700">C:\Dev\sun&gt;</text>
    <text x="160" y="44" font-size="20" fill="#F8FAFC">.\sun.exe enugu</text>

    <!-- Forecast Output: Enugu -->
    <text x="0" y="80" font-size="18" fill="#64748B">--- Upcoming Forecast for Enugu ---</text>
    <text x="0" y="108" font-size="18" fill="#E2E8F0">18:00 - 22°C, Rain: 26%, Mist</text>
    <text x="0" y="132" font-size="18" fill="#E2E8F0">19:00 - 22°C, Rain: 27%, Mist</text>
    <text x="0" y="156" font-size="18" fill="#E2E8F0">20:00 - 22°C, Rain: 27%, Mist</text>
    <text x="0" y="180" font-size="18" fill="#E2E8F0">21:00 - 22°C, Rain: 25%, Mist</text>
    <text x="0" y="204" font-size="18" fill="#E2E8F0">22:00 - 22°C, Rain: 25%, Mist</text>
    <text x="0" y="228" font-size="18" fill="#E2E8F0">23:00 - 22°C, Rain: 38%, Mist</text>

    <!-- Current Temp: Enugu -->
    <text x="0" y="268" font-size="19" fill="#38BDF8" font-weight="700">Currently in Enugu, Nigeria: 23.1°C, Patchy rain nearby</text>


    <!-- Command 2: Paris -->
    <text x="0" y="324" font-size="20" fill="#00ADD8" font-weight="700">C:\Dev\sun&gt;</text>
    <text x="160" y="324" font-size="20" fill="#F8FAFC">.\sun.exe paris</text>

    <!-- Forecast Output: Paris -->
    <text x="0" y="360" font-size="18" fill="#64748B">--- Upcoming Forecast for Paris ---</text>
    <text x="0" y="388" font-size="18" fill="#E2E8F0">18:00 - 28°C, Rain: 2%, Sunny</text>
    <text x="0" y="412" font-size="18" fill="#E2E8F0">19:00 - 26°C, Rain: 3%, Partly Cloudy</text>
    <text x="0" y="436" font-size="18" fill="#E2E8F0">20:00 - 24°C, Rain: 17%, Patchy rain nearby</text>
    <text x="0" y="460" font-size="18" fill="#E2E8F0">21:00 - 23°C, Rain: 18%, Patchy rain nearby</text>
    <text x="0" y="484" font-size="18" fill="#E2E8F0">22:00 - 20°C, Rain: 17%, Patchy rain nearby</text>

    <!-- Current Temp: Paris -->
    <text x="0" y="524" font-size="19" fill="#F59E0B" font-weight="700">Currently in Paris, France: 29.1°C, Patchy rain nearby</text>


    <!-- Command 3: Lagos -->
    <text x="0" y="580" font-size="20" fill="#00ADD8" font-weight="700">C:\Dev\sun&gt;</text>
    <text x="160" y="580" font-size="20" fill="#F8FAFC">.\sun.exe lagos</text>

    <!-- Forecast Output: Lagos -->
    <text x="0" y="616" font-size="18" fill="#64748B">--- Upcoming Forecast for Lagos ---</text>
    <text x="0" y="644" font-size="18" fill="#E2E8F0">18:00 - 25°C, Rain: 28%, Patchy rain nearby</text>
    <text x="0" y="668" font-size="18" fill="#E2E8F0">19:00 - 25°C, Rain: 19%, Patchy rain nearby</text>
    <text x="0" y="692" font-size="18" fill="#E2E8F0">20:00 - 25°C, Rain: 15%, Partly Cloudy</text>
    <text x="0" y="716" font-size="18" fill="#E2E8F0">21:00 - 26°C, Rain: 18%, Patchy rain nearby</text>
    <text x="0" y="740" font-size="18" fill="#E2E8F0">22:00 - 26°C, Rain: 18%, Patchy rain nearby</text>
    <text x="0" y="764" font-size="18" fill="#E2E8F0">23:00 - 25°C, Rain: 19%, Patchy rain nearby</text>

    <!-- Current Temp: Lagos -->
    <text x="0" y="804" font-size="19" fill="#38BDF8" font-weight="700">Currently in Lagos, Nigeria: 27.1°C, Partly cloudy</text>

    <!-- Active Terminal Cursor Prompt -->
    <text x="0" y="852" font-size="20" fill="#00ADD8" font-weight="700">C:\Dev\sun&gt;</text>
    <rect x="160" y="836" width="12" height="20" fill="#F8FAFC"/>
  </g>
</svg>
