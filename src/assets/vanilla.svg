<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Outer Card Canvas -->
  <rect width="800" height="1000" rx="32" fill="#090D16" stroke="#1E293B" stroke-width="6"/>

  <!-- Top Window Header -->
  <g transform="translate(32, 32)">
    <rect width="736" height="56" rx="16" fill="#1E293B"/>
    
    <!-- Window Control Buttons -->
    <circle cx="32" cy="28" r="7" fill="#EF4444"/>
    <circle cx="52" cy="28" r="7" fill="#F59E0B"/>
    <circle cx="72" cy="28" r="7" fill="#10B981"/>

    <!-- URL Bar / Title -->
    <rect x="180" y="12" width="376" height="32" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <text x="368" y="33" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle">vanilla-lab.github.io</text>

    <!-- Lab Tag Pill -->
    <rect x="616" y="12" width="100" height="32" rx="10" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1.5"/>
    <text x="666" y="33" font-family="monospace, sans-serif" font-size="12" font-weight="800" fill="#818CF8" text-anchor="middle">JS LAB</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(32, 104)">
    <!-- Sidebar Navigation Shell -->
    <rect width="210" height="840" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Sidebar Header -->
    <text x="24" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Vanilla Lab</text>
    <text x="24" y="64" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#64748B">HTML • CSS • JS</text>

    <line x1="20" y1="84" x2="190" y2="84" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Sidebar Item 1: Pomodoro Timer (Active) -->
    <g transform="translate(16, 100)">
      <rect width="178" height="48" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="16" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">⏱️ Pomodoro</text>
    </g>

    <!-- Sidebar Item 2: Calculator -->
    <g transform="translate(16, 160)">
      <rect width="178" height="48" rx="10" fill="#0B0F17"/>
      <text x="16" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">🧮 Calculator</text>
    </g>

    <!-- Sidebar Item 3: Flexbox Lab -->
    <g transform="translate(16, 220)">
      <rect width="178" height="48" rx="10" fill="#0B0F17"/>
      <text x="16" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">📐 Flexbox Lab</text>
    </g>

    <!-- Sidebar Item 4: Weather App -->
    <g transform="translate(16, 280)">
      <rect width="178" height="48" rx="10" fill="#0B0F17"/>
      <text x="16" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">🌤️ Weather Tool</text>
    </g>

    <!-- Main Viewport / Stage Shell -->
    <g transform="translate(226, 0)">
      <rect width="510" height="840" rx="16" fill="#05070A" stroke="#1E293B" stroke-width="2"/>

      <!-- Viewport Stage Header Bar -->
      <rect width="510" height="48" rx="16" fill="#0F172A"/>
      <text x="24" y="29" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Pomodoro Timer Preview</text>
      <text x="486" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818CF8" text-anchor="end">Open full ↗</text>
      <line x1="0" y1="48" x2="510" y2="48" stroke="#1E293B" stroke-width="1.5"/>

      <!-- Active Project Stage: Pomodoro Timer Card UI -->
      <g transform="translate(55, 120)">
        <!-- Outer Glass Stage Container -->
        <rect width="400" height="560" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>

        <!-- Timer Mode Switcher Pills -->
        <g transform="translate(50, 40)">
          <rect width="300" height="44" rx="22" fill="#1E293B"/>
          <!-- Active Pill -->
          <rect width="100" height="36" x="4" y="4" rx="18" fill="#EF4444"/>
          <text x="54" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Pomodoro</text>
          <text x="154" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">Short Break</text>
          <text x="250" y="27" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">Long Break</text>
        </g>

        <!-- Circular Timer Ring Graphic -->
        <g transform="translate(200, 260)">
          <!-- Outer Track Circle -->
          <circle cx="0" cy="0" r="130" fill="none" stroke="#1E293B" stroke-width="12"/>
          <!-- Active Arc Circle -->
          <circle cx="0" cy="0" r="130" fill="none" stroke="#EF4444" stroke-width="12" stroke-dasharray="816" stroke-dashoffset="240" stroke-linecap="round" transform="rotate(-90)"/>
          
          <!-- Digits -->
          <text x="0" y="18" font-family="monospace, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">25:00</text>
          <text x="0" y="52" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">FOCUS SESSION</text>
        </g>

        <!-- Control Buttons -->
        <g transform="translate(100, 440)">
          <!-- Start Button -->
          <rect width="200" height="60" rx="18" fill="#EF4444"/>
          <text x="100" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">START</text>
        </g>
      </g>

      <!-- Stage Footer Label -->
      <g transform="translate(24, 780)">
        <rect width="462" height="40" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="20" cy="20" r="5" fill="#10B981"/>
        <text x="36" y="25" font-family="monospace, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">STANDALONE IFRAME PREVIEW STAGE</text>
        <text x="446" y="25" font-family="monospace, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="end">DOM READY</text>
      </g>
    </g>
  </g>
</svg>
