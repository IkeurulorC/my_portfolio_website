<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Outer Card Background -->
  <rect width="800" height="1000" rx="32" fill="#0B0E14" stroke="#1E293B" stroke-width="6"/>

  <!-- Top Navigation / Header Section -->
  <rect x="40" y="48" width="80" height="80" rx="16" fill="#FFFFFF"/>
  <text x="80" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#000000" text-anchor="middle">B</text>
  
  <text x="144" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">Bass UI Kit</text>
  
  <!-- Version Tag Pill -->
  <rect x="580" y="56" width="180" height="64" rx="32" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="3"/>
  <text x="670" y="98" font-family="monospace, sans-serif" font-size="26" font-weight="700" fill="#34D399" text-anchor="middle">v1.0.4</text>

  <!-- Divider Line -->
  <line x1="40" y1="168" x2="760" y2="168" stroke="#1E293B" stroke-width="4"/>

  <!-- Crypto Metric Cards Grid -->
  <!-- Card 1: Bitcoin -->
  <rect x="40" y="208" width="344" height="200" rx="24" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="3"/>
  <circle cx="96" cy="264" r="28" fill="#F59E0B"/>
  <text x="96" y="277" font-family="sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">₿</text>
  <text x="140" y="274" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">BTC</text>
  <text x="72" y="356" font-family="monospace, sans-serif" font-size="38" font-weight="800" fill="#34D399">€56,004</text>

  <!-- Card 2: Ethereum -->
  <rect x="416" y="208" width="344" height="200" rx="24" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="3"/>
  <circle cx="472" cy="264" r="28" fill="#6366F1"/>
  <text x="472" y="277" font-family="sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">Ξ</text>
  <text x="516" y="274" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">ETH</text>
  <text x="448" y="356" font-family="monospace, sans-serif" font-size="38" font-weight="800" fill="#34D399">€1,611</text>

  <!-- Table Preview Container -->
  <rect x="40" y="448" width="720" height="380" rx="24" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="3"/>

  <!-- Row 1: Positive Trend -->
  <rect x="80" y="488" width="160" height="32" rx="8" fill="#334155"/>
  <path d="M 480 504 L 560 488 L 640 500 L 700 480" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>

  <!-- Row 2: Positive Trend -->
  <rect x="80" y="552" width="220" height="32" rx="8" fill="#1E293B"/>
  <path d="M 480 568 L 550 576 L 620 560 L 700 564" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>

  <!-- Row 3: Positive Trend -->
  <rect x="80" y="616" width="140" height="32" rx="8" fill="#1E293B"/>
  <path d="M 480 632 L 560 620 L 630 636 L 700 624" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>

  <!-- Row 4: Dip / Red Trend -->
  <rect x="80" y="680" width="190" height="32" rx="8" fill="#1E293B"/>
  <path d="M 480 692 L 540 700 L 610 684 L 700 696" fill="none" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>

  <!-- Row 5: Positive Trend -->
  <rect x="80" y="744" width="120" height="32" rx="8" fill="#1E293B"/>
  <path d="M 480 760 L 560 748 L 640 756 L 700 740" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>

  <!-- Footer Banner Badge -->
  <rect x="40" y="860" width="720" height="88" rx="20" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="904" r="12" fill="#34D399"/>
  <text x="112" y="914" font-family="monospace, sans-serif" font-size="28" font-weight="700" fill="#94A3B8">FINTECH ANALYTICS ENGINE</text>
  <text x="700" y="914" font-family="monospace, sans-serif" font-size="28" font-weight="800" fill="#34D399" text-anchor="end">▲ 0.85%</text>
</svg>
